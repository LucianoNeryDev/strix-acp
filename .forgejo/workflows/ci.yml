# Tests need no Docker, model or Strix: the one test that needs Strix's
# interpreter skips itself. The job runs in the runner's default image
# (node:22-bookworm), because checkout is a Node action; uv supplies the
# Pythons (3.11 is the floor) and the build backend.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  UV_VERSION: "0.12.1"

jobs:
  test:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install uv
        run: |
          archive=uv-x86_64-unknown-linux-gnu.tar.gz
          base="https://github.com/astral-sh/uv/releases/download/$UV_VERSION"
          cd "$(mktemp -d)"
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/$archive.sha256" | sha256sum -c -
          tar -xzf "$archive" --strip-components=1 -C /usr/local/bin

      - name: Test
        run: |
          for py in 3.11 3.13; do
            PYTHONPATH=src uv run --no-project --python "$py" python -m unittest discover -s tests -v
          done

      - name: Build
        run: |
          uv build
          uvx --from dist/*.whl strix-acp --version
