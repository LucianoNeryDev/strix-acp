# Tests only: no Docker, no model, no network. The one test that needs Strix's
# interpreter skips itself when Strix is not installed.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: python:3.13-slim
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Test
        run: |
          python -m pip install --quiet --disable-pip-version-check hatchling
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build
        run: python -m pip wheel --no-deps --wheel-dir dist .
